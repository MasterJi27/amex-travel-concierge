services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amex}
      POSTGRES_DB: ${POSTGRES_DB:-amex}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amex -d amex"]
      interval: 3s
      timeout: 3s
      retries: 20

  concierge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-amex}:${POSTGRES_PASSWORD:-amex}@postgres:5432/${POSTGRES_DB:-amex}
      PORT: "8002"
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  concierge-web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8002
    ports:
      - "5174:80"
